<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0a2a44" />
      <stop offset="60%" stop-color="#041220" />
      <stop offset="100%" stop-color="#02060c" />
    </radialGradient>

    <!-- Metallic Crown Gradient -->
    <linearGradient id="crownMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#d1d5db" />
      <stop offset="50%" stop-color="#9ca3af" />
      <stop offset="75%" stop-color="#e5e7eb" />
      <stop offset="100%" stop-color="#6b7280" />
    </linearGradient>

    <!-- Circuit Gold Gradient -->
    <linearGradient id="circuitGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Prismatic 'R' Gradient -->
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Orbital Ring -->
  <circle cx="256" cy="275" r="170" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="14 8" opacity="0.45" filter="url(#cyanGlow)" />
  <circle cx="256" cy="275" r="145" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 10" opacity="0.35" />

  <!-- Constellation Halo on Top -->
  <g opacity="0.8" stroke="#fbbf24" stroke-width="1.8" fill="none">
    <polygon points="256,65 210,88 226,118 286,118 302,88" />
    <line x1="256" y1="65" x2="226" y2="118" />
    <line x1="256" y1="65" x2="286" y2="118" />
    <circle cx="256" cy="65" r="4.5" fill="#fef08a" />
    <circle cx="210" cy="88" r="4" fill="#fef08a" />
    <circle cx="302" cy="88" r="4" fill="#fef08a" />
    <circle cx="226" cy="118" r="4" fill="#fef08a" />
    <circle cx="286" cy="118" r="4" fill="#fef08a" />
  </g>

  <!-- Crown Silhouette (Chiseled Steel & Gold Circuit Inlays) -->
  <g>
    <!-- Crown Body -->
    <path d="M 145 220 L 165 145 L 210 185 L 256 125 L 302 185 L 347 145 L 367 220 C 330 250, 182 250, 145 220 Z" 
          fill="url(#crownMetal)" stroke="#ffffff" stroke-width="2.5" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.6))" />
    
    <!-- Crown Interior Cutout -->
    <path d="M 175 210 L 188 165 L 218 190 L 256 150 L 294 190 L 324 165 L 337 210 C 310 230, 202 230, 175 210 Z" 
          fill="#061826" stroke="#fbbf24" stroke-width="1.2" opacity="0.9" />

    <!-- Circuit Lines in Crown -->
    <path d="M 256 155 L 256 200 M 235 175 L 256 185 M 277 175 L 256 185" 
          stroke="url(#circuitGold)" stroke-width="2" stroke-linecap="round" />
    <circle cx="256" cy="155" r="3" fill="#fbbf24" />
    <circle cx="235" cy="175" r="2.5" fill="#fbbf24" />
    <circle cx="277" cy="175" r="2.5" fill="#fbbf24" />
  </g>

  <!-- Core Prismatic Glass 'R' Emblem -->
  <g filter="url(#cyanGlow)">
    <!-- Main 'R' Shape -->
    <path d="M 215 205 L 285 205 C 318 205, 335 225, 335 250 C 335 272, 318 288, 285 288 L 252 288 L 312 365 L 272 365 L 224 300 L 215 300 L 215 365 L 185 365 L 185 205 Z M 215 235 L 215 265 L 280 265 C 298 265, 305 258, 305 250 C 305 242, 298 235, 280 235 Z" 
          fill="url(#rGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="2" />

    <!-- Glass Specular Highlight on 'R' -->
    <path d="M 220 210 L 275 210 C 295 210, 315 218, 315 238 C 300 220, 260 216, 220 220 Z" 
          fill="#ffffff" opacity="0.65" />
  </g>

  <!-- Satellite Nodes around Orbit -->
  <g>
    <!-- Top-Left Cloud Node -->
    <circle cx="160" cy="245" r="16" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.5))" />
    <circle cx="160" cy="245" r="7" fill="#ffffff" opacity="0.8" />
    
    <!-- Top-Right Mobile Node -->
    <circle cx="352" cy="245" r="16" fill="#ec4899" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.5))" />
    <circle cx="352" cy="245" r="7" fill="#ffffff" opacity="0.8" />
    
    <!-- Bottom-Left Users Node -->
    <circle cx="185" cy="355" r="16" fill="#8b5cf6" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.5))" />
    <circle cx="185" cy="355" r="7" fill="#ffffff" opacity="0.8" />
    
    <!-- Bottom Center Screen Node -->
    <circle cx="256" cy="385" r="18" fill="#3b82f6" stroke="#00f0ff" stroke-width="2.5" filter="url(#cyanGlow)" />
    <rect x="250" y="379" width="12" height="9" rx="1.5" fill="#ffffff" />
    <rect x="254" y="389" width="4" height="3" fill="#ffffff" />

    <!-- Bottom-Right Chart Node -->
    <circle cx="327" cy="355" r="16" fill="#f97316" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.5))" />
    <circle cx="327" cy="355" r="7" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Typography at bottom -->
  <text x="256" y="440" text-anchor="middle" font-family="'Space Mono', monospace, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="4">REYPLACE.MX</text>
  <text x="256" y="468" text-anchor="middle" font-family="'Space Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#00f0ff" letter-spacing="6">ECOSISTEMA DIGITAL</text>
</svg>
